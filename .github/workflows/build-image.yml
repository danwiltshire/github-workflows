name: Build image

on:
  workflow_call:
    inputs:
      architecture:
        description: "Runner architecture: amd64 or arm64."
        type: string
        default: amd64
      context:
        description: "Docker build context path, for example . or ./service."
        type: string
        default: .
      file:
        description: "Dockerfile path, for example Dockerfile or docker/Dockerfile."
        type: string
        default: Dockerfile
      build-args:
        description: "Newline-delimited Docker build arguments, for example VERSION=1.2.3."
        type: string
        default: ""
      tag-prefix:
        description: "Prefix for image tags, for example ui produces ui-latest and ui-abcdef1."
        type: string
        default: ""
      repository-uri:
        description: "Container repository URI, for example 123456789012.dkr.ecr.eu-west-2.amazonaws.com/my-image; defaults to vars.ECR_REPOSITORY_URI."
        type: string
        default: ${{ vars.ECR_REPOSITORY_URI }}

    outputs:
      sha-tag:
        description: "Image tag containing the short commit SHA, for example abcdef1 or ui-abcdef1."
        value: ${{ jobs.build.outputs.sha-tag }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ${{ inputs.architecture == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    outputs:
      sha-tag: ${{ steps.sha-tag.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKER_METADATA_PR_HEAD_SHA: "true"  # Argo CD preview environments
          DOCKER_METADATA_SHORT_SHA_LENGTH: "7"
        with:
          images: ${{ inputs.repository-uri }}
          tags: |
            type=raw,value=latest,prefix=${{ inputs.tag-prefix != '' && format('{0}-', inputs.tag-prefix) || '' }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=${{ inputs.tag-prefix != '' && format('{0}-', inputs.tag-prefix) || '' }}

      - name: Expose SHA tag
        id: sha-tag
        env:
          TAG_NAMES: ${{ steps.meta.outputs.tag-names }}
        run: |
          set -euo pipefail
          tag=$(grep -Ex '.*[0-9a-f]{7}' <<< "$TAG_NAMES")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_ECR_PUBLISH }}
          aws-region: eu-west-2

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        with:
          registries: "426576223955"

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          build-args: ${{ inputs.build-args }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
